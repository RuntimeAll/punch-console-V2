<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy:#153a5e; --navy-d:#0e2c4a; --ink:#12324e;
    --blue:#3f77b0; --blue-2:#6aa0d0; --steel:#8493a3;
    --faint:#c9d9e8; --blob:#dbebf6; --blob-2:#cadff0;
    --beige:#e9ddbf; --beige-d:#cdbd93; --accent:#e7b23f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:900px;height:1273px}
  body{
    font-family:"Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#ffffff 0%,#f4f9fd 62%,#eaf3fb 100%);
    color:var(--ink); position:relative; overflow:hidden;
  }
  /* faint blueprint axes */
  svg.bg{position:absolute;inset:0;width:900px;height:1273px}
  /* title */
  .head{position:absolute;left:96px;top:152px;right:80px}
  .eyebrow{display:flex;align-items:center;gap:16px;font-size:23px;letter-spacing:.3em;
    color:var(--blue);font-weight:700;margin-bottom:26px}
  .eyebrow .dot{width:10px;height:10px;background:var(--accent);transform:rotate(45deg)}
  .h1{font-size:116px;font-weight:900;color:var(--navy);letter-spacing:.03em;line-height:1;
    white-space:nowrap;text-shadow:0 3px 0 rgba(21,58,94,.05)}
  .row2{display:flex;align-items:baseline;gap:30px;margin-top:26px}
  .h2{font-size:74px;font-weight:900;color:var(--navy);letter-spacing:.08em;line-height:1;white-space:nowrap}
  .men{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
  .men .m1{font-size:28px;letter-spacing:.26em;color:var(--blue);font-weight:800}
  .pill{align-self:flex-start;background:var(--blob-2);color:#2c567e;font-size:20px;font-weight:800;
    letter-spacing:.2em;padding:9px 22px;border-radius:22px;white-space:nowrap}
  .en-sub{margin-top:28px;font-size:24px;letter-spacing:.34em;color:#5c86ad;font-weight:700}
  .en-sub b{color:var(--accent)}

  /* author name — inside blob, bottom center */
  .brand-cn{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;text-align:center;z-index:10}
  .brand-cn .n{font-size:60px;font-weight:900;color:var(--navy);letter-spacing:.24em;line-height:1;padding-left:.24em}
  .brand-cn .u{margin:16px auto 0;width:120px;height:4px;border-radius:3px;
    background:linear-gradient(90deg,rgba(231,178,63,0),var(--accent),rgba(231,178,63,0))}

  /* illustration */
  svg.art{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;width:880px;height:640px}
</style>
</head>
<body>
  <!-- background axes / motifs -->
  <svg class="bg" viewBox="0 0 900 1273" fill="none">
    <line x1="112" y1="60" x2="112" y2="560" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="2 9"/>
    <circle cx="112" cy="86" r="6" stroke="var(--faint)" stroke-width="1.4"/>
    <line x1="40" y1="430" x2="860" y2="430" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="2 9"/>
    <path d="M860 430 l-16 -6 v12 z" fill="var(--faint)"/>
    <!-- small grid+triangle lower-left -->
    <g stroke="var(--faint)" stroke-width="1.2" opacity=".8">
      <path d="M70 640 h150 v150 h-150 z" stroke-dasharray="3 7"/>
      <path d="M70 790 L220 640" stroke-dasharray="3 7"/>
    </g>
    <!-- triangle mid-right -->
    <path d="M628 452 L748 452 L748 356 Z" stroke="var(--faint)" stroke-width="1.6"/>
  </svg>

  <div class="head">
    <div class="eyebrow"><span class="dot"></span>{{EYEBROW}}</div>
    <div class="h1">{{TITLE}}</div>
    <div class="row2">
      <div class="h2">{{SUBTITLE}}</div>
      <div class="men">
        <div class="m1">{{EN_LINE}}</div>
        <div class="pill">{{PILL}}</div>
      </div>
    </div>
    <div class="en-sub">{{EN_SUB_HTML}}</div>
  </div>

  <div class="brand-cn"><div class="n">{{AUTHOR}}</div><div class="u"></div></div>

  <!-- flat-lay math tools inside a soft blob -->
  <svg class="art" viewBox="0 0 880 640" fill="none">
    <!-- blob -->
    <path d="M150 300 C90 190 250 120 400 138 C520 152 560 96 680 150 C820 212 850 300 810 400
             C775 490 690 540 560 556 C430 572 300 574 220 536 C120 488 100 388 150 300 Z"
          fill="var(--blob)"/>
    <path d="M180 320 C128 224 268 160 405 176 C516 189 556 140 664 188 C788 244 812 322 776 410
             C744 490 668 534 552 548 C436 562 318 564 246 530 C156 486 138 398 180 320 Z"
          fill="var(--blob-2)" opacity=".40"/>

    <!-- clipboard + line chart (left) -->
    <g transform="rotate(-9 265 340)">
      <rect x="175" y="215" width="185" height="240" rx="8" fill="#ffffff" stroke="#c4d3e0" stroke-width="2"/>
      <rect x="175" y="215" width="34" height="240" fill="#2f5c86"/>
      <g opacity=".85"><rect x="182" y="238" width="20" height="9" fill="#cfe0ef"/><rect x="182" y="262" width="20" height="9" fill="#cfe0ef"/><rect x="182" y="286" width="20" height="9" fill="#cfe0ef"/></g>
      <polyline points="228,410 262,368 292,388 330,320" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="330" cy="320" r="5" fill="var(--accent)"/>
      <line x1="222" y1="250" x2="345" y2="250" stroke="#d7e2ee" stroke-width="2"/>
      <line x1="222" y1="272" x2="345" y2="272" stroke="#d7e2ee" stroke-width="2"/>
    </g>

    <!-- compass (top center) -->
    <g transform="rotate(-8 430 210)" stroke="var(--steel)" stroke-width="7" stroke-linecap="round" fill="none">
      <circle cx="430" cy="150" r="10" fill="var(--steel)" stroke="none"/>
      <line x1="430" y1="158" x2="392" y2="262"/>
      <line x1="430" y1="158" x2="470" y2="258"/>
      <path d="M392 262 l-6 16" stroke="var(--navy)" stroke-width="6"/>
      <path d="M470 258 l7 15" stroke="#b9c4cf" stroke-width="6"/>
    </g>

    <!-- notepad with scribbles (center) -->
    <g transform="rotate(6 470 330)">
      <rect x="378" y="230" width="196" height="235" rx="6" fill="#ffffff" stroke="#cbd8e4" stroke-width="2"/>
      <g stroke="#e0e8f0" stroke-width="2">
        <line x1="398" y1="270" x2="556" y2="270"/><line x1="398" y1="300" x2="556" y2="300"/>
        <line x1="398" y1="330" x2="556" y2="330"/><line x1="398" y1="360" x2="556" y2="360"/>
        <line x1="398" y1="390" x2="556" y2="390"/><line x1="398" y1="420" x2="556" y2="420"/>
      </g>
      <g stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".8">
        <path d="M404 264 q14 -10 26 2 t26 0"/>
        <path d="M470 292 l16 -16 16 16 z"/>
        <path d="M404 326 q20 -8 40 0"/>
        <path d="M410 356 l10 8 16 -18"/>
        <path d="M404 388 q18 10 40 -2 t44 4"/>
      </g>
    </g>

    <!-- ruler (diagonal, center-right) -->
    <g transform="rotate(38 560 380)">
      <rect x="470" y="360" width="300" height="40" rx="7" fill="var(--beige)" stroke="var(--beige-d)" stroke-width="2"/>
      <g stroke="#9a8a5e" stroke-width="2">
        <line x1="490" y1="360" x2="490" y2="382"/><line x1="510" y1="360" x2="510" y2="374"/>
        <line x1="530" y1="360" x2="530" y2="382"/><line x1="550" y1="360" x2="550" y2="374"/>
        <line x1="570" y1="360" x2="570" y2="382"/><line x1="590" y1="360" x2="590" y2="374"/>
        <line x1="610" y1="360" x2="610" y2="382"/><line x1="630" y1="360" x2="630" y2="374"/>
        <line x1="650" y1="360" x2="650" y2="382"/><line x1="670" y1="360" x2="670" y2="374"/>
        <line x1="690" y1="360" x2="690" y2="382"/><line x1="710" y1="360" x2="710" y2="374"/>
        <line x1="730" y1="360" x2="730" y2="382"/><line x1="750" y1="360" x2="750" y2="374"/>
      </g>
    </g>

    <!-- calculator (anchor, right) -->
    <g transform="rotate(9 690 350)">
      <rect x="612" y="250" width="176" height="232" rx="20" fill="var(--navy-d)"/>
      <rect x="612" y="250" width="176" height="232" rx="20" fill="none" stroke="#0a2138" stroke-width="2"/>
      <rect x="632" y="270" width="136" height="52" rx="7" fill="#dce9f2"/>
      <g fill="#e9f1f8">
        <rect x="632" y="338" width="26" height="24" rx="5"/><rect x="668" y="338" width="26" height="24" rx="5"/><rect x="704" y="338" width="26" height="24" rx="5"/><rect x="740" y="338" width="28" height="24" rx="5"/>
        <rect x="632" y="370" width="26" height="24" rx="5"/><rect x="668" y="370" width="26" height="24" rx="5"/><rect x="704" y="370" width="26" height="24" rx="5"/><rect x="740" y="370" width="28" height="24" rx="5"/>
        <rect x="632" y="402" width="26" height="24" rx="5"/><rect x="668" y="402" width="26" height="24" rx="5"/><rect x="704" y="402" width="26" height="24" rx="5"/>
        <rect x="632" y="434" width="26" height="24" rx="5"/><rect x="668" y="434" width="26" height="24" rx="5"/><rect x="704" y="434" width="26" height="24" rx="5"/>
      </g>
      <rect x="740" y="402" width="28" height="56" rx="5" fill="var(--accent)"/>
    </g>

    <!-- protractor (bottom-right) -->
    <g transform="rotate(-12 640 470)">
      <path d="M556 486 a86 86 0 0 1 172 0 z" fill="#e7f1f9" stroke="var(--blue-2)" stroke-width="2.5"/>
      <path d="M576 486 a66 66 0 0 1 132 0" fill="none" stroke="var(--blue-2)" stroke-width="1.6"/>
      <g stroke="var(--blue)" stroke-width="1.6">
        <line x1="642" y1="400" x2="642" y2="418"/>
        <line x1="588" y1="430" x2="600" y2="440"/><line x1="696" y1="430" x2="684" y2="440"/>
        <line x1="564" y1="470" x2="580" y2="474"/><line x1="720" y1="470" x2="704" y2="474"/>
      </g>
      <circle cx="642" cy="486" r="4" fill="var(--blue)"/>
    </g>

    <!-- glasses (bottom left) -->
    <g transform="translate(150 470) rotate(-6) scale(.82)" stroke="var(--navy)" stroke-width="8" fill="none" stroke-linecap="round">
      <circle cx="46" cy="40" r="34"/>
      <circle cx="140" cy="40" r="34"/>
      <path d="M80 34 q14 -12 26 0"/>
      <path d="M12 40 l-26 -10"/>
      <path d="M174 40 l26 -10"/>
    </g>
  </svg>
</body>
</html>
